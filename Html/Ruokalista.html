<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruokalista – Metro Pizza</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .day-block {
      margin-bottom: 2.5rem;
    }
    .day-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .day-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .day-block.today .day-name { color: var(--accent); }
    .day-block.today .menu-item {
      border-color: rgba(232,71,42,0.2);
    }
    .week-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    .week-nav button {
      padding: 0.5rem 1.1rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .week-nav button.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .order-bar {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 50;
    }
    .cart-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(232,71,42,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(232,71,42,0.45);
    }
    .cart-count {
      background: #fff;
      color: var(--accent);
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .add-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .add-btn:hover { background: var(--accent); border-color: transparent; color: #fff; }
    .filter-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-row span {
      font-size: 0.8rem;
      color: var(--text2);
      margin-right: 0.25rem;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Metro<span>.</span>Pizza</a>
  <ul>
    <li><a href="ruokalista.html" class="active" style="color:var(--text)">Ruokalista</a></li>
    <li><a href="sijainti.html">Sijainti</a></li>
    <li><a href="kirjaudu.html">Kirjaudu</a></li>
    <li><a href="ruokalista.html" class="btn btn-primary">Tilaa nyt</a></li>
  </ul>
</nav>

<div class="page-header">
  <div class="section-label" id="viikko-otsikko">Lounaslista</div>
  <h1 class="section-title" style="margin-bottom:0.75rem">Ruokalista</h1>
  <p style="color:var(--text2);font-size:0.9rem">Tuore, päivittäin vaihtuva lounaslista</p>
</div>

<section>
  <div class="container">

    <!-- Diet filter -->
    <div class="filter-row">
      <span>Suodata:</span>
      <button class="tab active" data-filter="kaikki">Kaikki</button>
      <button class="tab" data-filter="kasvis">Kasvis</button>
      <button class="tab" data-filter="gluteeniton">Gluteeniton</button>
      <button class="tab" data-filter="laktoositon">Laktoositon</button>
    </div>

    <!--
      Dynaaminen ruokalista.
      menu.js hakee tuotteet backendistä ja renderöi ne tähän konttiin.
      Kovakoodatut päiväblokit (Maanantai–Perjantai) on poistettu.
    -->
    <div id="dynamic-menu"></div>

  </div>
</section>

<!-- Floating cart -->
<div class="order-bar">
  <button class="cart-btn">
    🛒 Ostoskori
    <span class="cart-count">0</span>
  </button>
</div>

<footer>
  <p>© 2026 Metro Pizza &nbsp;·&nbsp; <a href="hallinta.html">Ylläpito</a></p>
</footer>

<!--
  TÄRKEÄÄ: menu.js ennen cart.js!
  menu.js renderöi .add-btn -napit dynaamisesti.
  cart.js sitoo click-handlerit niihin DOMContentLoaded-tapahtumassa.
  Jos järjestys on väärä, napit eivät toimi.
-->
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
