<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirjaudu – Metro Pizza</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-bg"></div>

<div class="auth-layout">
  <div style="width:100%;max-width:420px">
    <a href="index.html" class="back-link">← Takaisin etusivulle</a>

    <div class="auth-card">
      <div class="auth-logo">Metro<span>.</span>Pizza</div>
      <p style="color:var(--text2);font-size:0.88rem;margin-bottom:0">Tilaa helposti kampuksella</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Kirjaudu</button>
        <button class="auth-tab" id="tab-register">Rekisteröidy</button>
      </div>

      <!-- Login form -->
      <div id="form-login">
        <div class="form-group">
          <label for="login-email">Sähköposti</label>
          <input type="email" id="login-email" placeholder="etu.suku@metropolia.fi" />
        </div>
        <div class="form-group">
          <label for="login-password">Salasana</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button id="login-btn" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:0.5rem">
          Kirjaudu sisään
        </button>

        <div class="divider"><span>tai</span></div>

        <button class="btn btn-outline" style="width:100%;padding:0.75rem" id="goto-register">
          Luo uusi tili
        </button>
      </div>

      <!-- Register form -->
      <div id="form-register" style="display:none">
        <div class="form-group">
          <label for="register-etunimi">Etunimi</label>
          <input type="text" id="register-etunimi" placeholder="Mikael" />
        </div>
        <div class="form-group">
          <label for="register-sukunimi">Sukunimi</label>
          <input type="text" id="register-sukunimi" placeholder="Virtanen" />
        </div>
        <div class="form-group">
          <label for="register-email">Sähköposti</label>
          <input type="email" id="register-email" placeholder="etu.suku@metropolia.fi" />
        </div>
        <div class="form-group">
          <label for="register-opiskelijanumero">
            Opiskelijanumero
            <span style="color:var(--text2);font-weight:300">(valinnainen)</span>
          </label>
          <input type="text" id="register-opiskelijanumero" placeholder="esim. A2300123" />
        </div>
        <div class="form-group">
          <label for="register-password">Salasana</label>
          <input type="password" id="register-password" placeholder="Vähintään 8 merkkiä" />
        </div>
        <button id="register-btn" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:0.25rem">
          Luo tili
        </button>

        <div class="student-info">
          <strong>Opiskelija-alennukset:</strong>
          Syöttämällä opiskelijanumerosi saat automaattisesti opiskelijahinnat kaikille tuotteille.
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/nav-auth.js"></script>
</body>
</html>
