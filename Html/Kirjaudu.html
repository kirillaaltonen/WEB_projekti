<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirjaudu – Metro Pizza</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-bg"></div>

<div class="auth-layout">
  <div style="width:100%;max-width:420px">
    <a href="index.html" class="back-link">← Takaisin etusivulle</a>

    <div class="auth-card">
      <div class="auth-logo">Metro<span>.</span>Pizza</div>
      <p style="color:var(--text2);font-size:0.88rem;margin-bottom:0">Tilaa helposti kampuksella</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Kirjaudu</button>
        <button class="auth-tab" id="tab-register">Rekisteröidy</button>
      </div>

      <!-- Login form -->
      <div id="form-login">
        <div class="form-group">
          <label for="email">Sähköposti</label>
          <input type="email" id="email" placeholder="etu.suku@metropolia.fi" />
        </div>
        <div class="form-group">
          <label for="password">Salasana</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:0.5rem">
          Kirjaudu sisään
        </button>

        <div class="divider"><span>tai</span></div>

        <button class="btn btn-outline" style="width:100%;padding:0.75rem" onclick="document.getElementById('tab-register').click()">
          Luo uusi tili
        </button>
      </div>

      <!-- Register form (hidden) -->
      <div id="form-register" style="display:none">
        <div class="form-group">
          <label>Etunimi</label>
          <input type="text" placeholder="Mikael" />
        </div>
        <div class="form-group">
          <label>Sukunimi</label>
          <input type="text" placeholder="Virtanen" />
        </div>
        <div class="form-group">
          <label>Sähköposti</label>
          <input type="email" placeholder="etu.suku@metropolia.fi" />
        </div>
        <div class="form-group">
          <label>Opiskelijanumero <span style="color:var(--text2);font-weight:300">(valinnainen)</span></label>
          <input type="text" placeholder="esim. A2300123" />
        </div>
        <div class="form-group">
          <label>Salasana</label>
          <input type="password" placeholder="Vähintään 8 merkkiä" />
        </div>
        <button class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:0.25rem">
          Luo tili
        </button>

        <div class="student-info">
          <strong>Opiskelija-alennukset:</strong> Syöttämällä opiskelijanumerosi saat automaattisesti opiskelijahinnat kaikille tuotteille.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const tabLogin = document.getElementById('tab-login');
  const tabReg   = document.getElementById('tab-register');
  const fLogin   = document.getElementById('form-login');
  const fReg     = document.getElementById('form-register');

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active'); tabReg.classList.remove('active');
    fLogin.style.display = 'block'; fReg.style.display = 'none';
  });
  tabReg.addEventListener('click', () => {
    tabReg.classList.add('active'); tabLogin.classList.remove('active');
    fReg.style.display = 'block'; fLogin.style.display = 'none';
  });
</script>

</body>
</html>
